name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead? Add a screenshot if you can.
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Route and page
      placeholder: "e.g. Machame, /embed, large-text mode"
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: "e.g. Chrome 130 on Android"
